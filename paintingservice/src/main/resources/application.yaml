spring:
  application:
    name: paintingservice
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:classpath:application-local.yaml"
  datasource:
    url: jdbc:mysql://localhost:3306/paintingservice
    username: root
    password: 123456
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  signerKey: ${JWT_SIGNER_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload:
    dir: uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  default-admin:
    username: ${DEFAULT_ADMIN_USERNAME:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:123456}
    email: ${DEFAULT_ADMIN_EMAIL:admin@suachua247.com}
    phone: ${DEFAULT_ADMIN_PHONE:0987654321}
    address: ${DEFAULT_ADMIN_ADDRESS:Hà Nội}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/customer/payment-callback}
