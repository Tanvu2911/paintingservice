
services:
  # =========================================================
  # 1. DATABASE: MySQL 8.0
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: paintingservice_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paintingservice}
      MYSQL_USER: ${MYSQL_USER:-paintingservice_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-paintingservice_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================
  # 2. BACKEND: Spring Boot (Java 21)
  # =========================================================
  backend:
    build:
      context: ./paintingservice
      dockerfile: Dockerfile
    container_name: paintingservice_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-paintingservice}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-paintingservice_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-paintingservice_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:80}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:80}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-123456}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@suachua247.com}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-0987654321}
      DEFAULT_ADMIN_ADDRESS: ${DEFAULT_ADMIN_ADDRESS:-Hà Nội}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost/customer/payment-callback}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - app_network

  # =========================================================
  # 3. FRONTEND: React (Vite) + Nginx Reverse Proxy
  # =========================================================
  frontend:
    build:
      context: ./paintingservice_ui
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: paintingservice_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
