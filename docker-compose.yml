version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: paintingservice_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paintingservice
      MYSQL_USER: paintingservice_user
      MYSQL_PASSWORD: paintingservice_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./paintingservice
      dockerfile: Dockerfile
    container_name: paintingservice_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/paintingservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: paintingservice_user
      SPRING_DATASOURCE_PASSWORD: paintingservice_password
      APP_CORS_ALLOWED_ORIGINS: http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    networks:
      - app_network

  frontend:
    build:
      context: ./paintingservice_ui
      dockerfile: Dockerfile
    container_name: paintingservice_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
