name: Painting Service CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend (Spring Boot / Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        working-directory: ./paintingservice
        run: mvn clean test-compile

  frontend-test-and-build:
    name: Frontend (React 19 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./paintingservice_ui/package-lock.json

      - name: Install dependencies
        working-directory: ./paintingservice_ui
        run: npm ci

      - name: Build React App
        working-directory: ./paintingservice_ui
        run: npm run build
